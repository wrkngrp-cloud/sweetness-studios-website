name: Deploy to GitHub Pages

# Standalone deploy for the Sweetness Studios site on its own repo and
# custom domain (sweetnesstudios.online). The site is served from the root
# of the domain, so there is no base path. The domain is pinned by the
# CNAME file in public/, which the static export copies into out/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build static export
        env:
          # Custom domain serves from the root, so no base path.
          NEXT_PUBLIC_BASE_PATH: ""
        run: |
          npm ci
          npm run build

      # Bypass Jekyll so the _next/ asset folder is served as-is.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
